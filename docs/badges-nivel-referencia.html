<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Badges de Nível · Diamante Ilustrado · Boldfy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #FAF7FF;
    font-family: 'Inter', sans-serif;
    color: #45336B;
    padding: 60px 32px;
  }
  .page { max-width: 1200px; margin: 0 auto; }
  .page-title {
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 900;
    font-size: 28px;
    color: #5E2A67;
    letter-spacing: -0.025em;
    margin-bottom: 8px;
  }
  .page-sub {
    font-size: 13px;
    color: #9D85B3;
    margin-bottom: 48px;
    line-height: 1.5;
  }
  .size-section {
    margin-bottom: 56px;
    padding-bottom: 56px;
    border-bottom: 1px solid #E4D8ED;
  }
  .size-section:last-child { border-bottom: none; }
  .size-title {
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 900;
    font-size: 14px;
    color: #5E2A67;
    margin-bottom: 32px;
    text-align: center;
  }
  .levels-row {
    display: flex;
    gap: 24px;
    align-items: flex-end;
    justify-content: center;
    flex-wrap: wrap;
  }
  .level-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .level-label {
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 900;
    font-size: 10px;
    color: #9D85B3;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .gem {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gem svg {
    filter: drop-shadow(0 6px 16px var(--gem-shadow));
  }
  .gem .gem-num {
    position: absolute;
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 900;
    color: #fff;
    z-index: 2;
    line-height: 1;
  }
  .gem.sz-xl { --w: 100px; }
  .gem.sz-xl .gem-num { font-size: 28px; margin-top: 6px; }
  .gem.sz-lg { --w: 76px; }
  .gem.sz-lg .gem-num { font-size: 22px; margin-top: 4px; }
  .gem.sz-md { --w: 52px; }
  .gem.sz-md .gem-num { font-size: 16px; margin-top: 3px; }
  .gem.sz-sm { --w: 36px; }
  .gem.sz-sm .gem-num { font-size: 12px; margin-top: 2px; }

    text-shadow: 0 2px 4px rgba(0,0,0,.25);

    background: #1A0B22;
    border-radius: 20px;
    padding: 40px;
    margin-top: 8px;
  }

  .dark-title {
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 900;
    font-size: 14px;
    color: rgba(255,255,255,.5);
    margin-bottom: 28px;
    text-align: center;
  }
</style>

# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Auto-scale: min 1 instance always warm, up to 10 under load
  minInstances: 1
  maxInstances: 10
  # Memory/CPU for Next.js with Genkit AI
  memoryMiB: 1024
  cpu: 1
  concurrency: 80

env:
  # --- Variaveis publicas (seguras no yaml) ---
  - variable: NEXT_PUBLIC_BASE_URL
    value: https://app.boldfy.com.br
  - variable: NEXT_PUBLIC_LINKEDIN_CLIENT_ID
    value: 77wolsgmze0icj
  - variable: LINKEDIN_REDIRECT_URI
    value: https://app.boldfy.com.br/api/auth/linkedin/callback

  # --- Secrets (referenciados via Cloud Secret Manager) ---
  # Para criar: firebase apphosting:secrets:set <NOME_DO_SECRET>
  # Para dar acesso: firebase apphosting:secrets:grantaccess <NOME_DO_SECRET>
  - variable: GOOGLE_GENAI_API_KEY
    secret: GOOGLE_GENAI_API_KEY
  - variable: SMTP_EMAIL
    secret: SMTP_EMAIL
  - variable: SMTP_PASSWORD
    secret: SMTP_PASSWORD
  - variable: LINKEDIN_CLIENT_SECRET
    secret: LINKEDIN_CLIENT_SECRET
  - variable: CRON_SECRET
    secret: CRON_SECRET
  - variable: NOTION_API_KEY
    secret: NOTION_API_KEY

  # --- Slack (notifications) ---
  - variable: SLACK_BOT_TOKEN
    secret: SLACK_BOT_TOKEN

  # --- Session cookie signing (required for login to work) ---
  - variable: COOKIE_SECRET
    secret: COOKIE_SECRET

  # --- Stripe (payments) ---
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    value: pk_live_51RWi7iAkR3p87HetSpR9E2ccYJRhb0qZFy8NMunwFSTD5V5Tbmo0G3dxttnj6v5yJhjTkH5ZCOEAsJ84tX80McOJ00qSlbtB0v
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET

  # --- Sentry (error monitoring) ---
  - variable: NEXT_PUBLIC_SENTRY_DSN
    value: https://a2e7f575ee31e1da49ad2d905e70f8f3@o4511207197573120.ingest.us.sentry.io/4511207201832960
  - variable: SENTRY_ORG
    value: boldfy
  - variable: SENTRY_PROJECT
    value: javascript-nextjs
  # SENTRY_AUTH_TOKEN — add after creating secret:
  # firebase apphosting:secrets:set SENTRY_AUTH_TOKEN

  # --- Variáveis públicas do Notion ---
  - variable: NOTION_FEEDBACK_DB_ID
    value: 33994982dee4807eb456e291ca3f6dc4
  - variable: NOTION_SUPPORT_DB_ID
    value: 33994982dee4809c9764f7c5f078556e

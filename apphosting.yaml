# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

env:
  # --- Variaveis publicas (seguras no yaml) ---
  - variable: NEXT_PUBLIC_BASE_URL
    value: https://app.boldfy.com.br

  # --- Secrets (referenciados via Cloud Secret Manager) ---
  # Para criar: firebase apphosting:secrets:set <NOME_DO_SECRET>
  - variable: GOOGLE_GENAI_API_KEY
    secret: GOOGLE_GENAI_API_KEY
  - variable: SMTP_EMAIL
    secret: SMTP_EMAIL
  - variable: SMTP_PASSWORD
    secret: SMTP_PASSWORD
  - variable: LINKEDIN_CLIENT_SECRET
    secret: LINKEDIN_CLIENT_SECRET
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
  - variable: CRON_SECRET
    secret: CRON_SECRET

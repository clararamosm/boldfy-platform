<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showcase Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #FAF7FF; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 24px; }

.section {
  max-width: 1100px;
  width: 100%;
}

/* Header */
.sec-header {
  text-align: center;
  margin-bottom: 32px;
}
.pill {
  display: inline-flex;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  background: #CD50F1;
  color: #fff;
  padding: 5px 14px;
  border-radius: 20px;
  margin-bottom: 12px;
}
.sec-header h3 {
  font-size: 18px;
  font-weight: 700;
  color: #1A1A2E;
  margin-bottom: 4px;
}
.sec-header p {
  font-size: 12px;
  color: #7A6889;
}

/* Showcase container */
.showcase {
  position: relative;
  height: 420px;
  perspective: 1200px;
}

/* Each screen card */
.screen {
  position: absolute;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(93,42,103,.15), 0 2px 8px rgba(0,0,0,.06);
  border: 1px solid rgba(205,80,241,.1);
  transition: transform 0.4s ease, box-shadow 0.4s ease;
}
.screen:hover {
  transform: translateY(-8px) !important;
  box-shadow: 0 16px 60px rgba(93,42,103,.25), 0 4px 12px rgba(0,0,0,.08);
  z-index: 10 !important;
}

.screen img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top left;
  display: block;
}

/* Gradient overlay — hides details, gives that "peek" feel */
.screen::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    transparent 0%,
    transparent 40%,
    rgba(250,247,255,0.3) 70%,
    rgba(250,247,255,0.85) 100%
  );
  pointer-events: none;
}

/* ─── LAYOUT: overlapping cards ─── */

/* Dashboard - back left, largest */
.screen-1 {
  width: 520px;
  height: 340px;
  top: 40px;
  left: 0;
  z-index: 1;
  transform: rotate(-2deg);
}

/* Assistente IA - center, raised */
.screen-2 {
  width: 480px;
  height: 320px;
  top: 10px;
  left: 50%;
  transform: translateX(-50%) rotate(0.5deg);
  z-index: 4;
}

/* Rankings - right, overlapping */
.screen-3 {
  width: 400px;
  height: 280px;
  top: 60px;
  right: 0;
  z-index: 3;
  transform: rotate(2deg);
}

/* Calendario - bottom left */
.screen-4 {
  width: 380px;
  height: 260px;
  bottom: 0;
  left: 60px;
  z-index: 2;
  transform: rotate(1.5deg);
}

/* Missoes - bottom right */
.screen-5 {
  width: 360px;
  height: 250px;
  bottom: 10px;
  right: 80px;
  z-index: 2;
  transform: rotate(-1.5deg);
}

/* Labels on screens */
.screen-label {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 5;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(205,80,241,0.15);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 9px;
  font-weight: 700;
  color: #5E2A67;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.screen-label .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #CD50F1;
}

/* ─── Placeholder screens (simulating real screenshots) ─── */
.placeholder {
  width: 100%;
  height: 100%;
  background: #fff;
  position: relative;
}

/* Simulate sidebar */
.ph-sidebar {
  position: absolute;
  top: 0;
  left: 0;
  width: 180px;
  height: 100%;
  background: linear-gradient(180deg, #FAF2FF 0%, #F3E8FC 100%);
  border-right: 1px solid #E8D8F5;
  padding: 16px 12px;
}
.ph-sidebar-logo {
  width: 60px;
  height: 16px;
  background: #CD50F1;
  border-radius: 4px;
  opacity: 0.3;
  margin-bottom: 20px;
}
.ph-sidebar-item {
  height: 8px;
  border-radius: 4px;
  margin-bottom: 14px;
  opacity: 0.15;
}
.ph-sidebar-item.active {
  background: #CD50F1;
  opacity: 0.4;
  border-radius: 6px;
  height: 26px;
  margin-left: -4px;
  margin-right: -4px;
  padding: 0;
}

/* Simulate content area */
.ph-content {
  position: absolute;
  top: 0;
  left: 180px;
  right: 0;
  height: 100%;
  padding: 16px 20px;
  overflow: hidden;
}
.ph-title {
  height: 12px;
  width: 140px;
  background: #1A1A2E;
  border-radius: 4px;
  opacity: 0.15;
  margin-bottom: 20px;
}
.ph-card {
  background: #FAF7FF;
  border: 1px solid #E8D8F5;
  border-radius: 8px;
  height: 60px;
  margin-bottom: 10px;
}
.ph-card.purple {
  border-color: #CD50F1;
  background: linear-gradient(135deg, #F7EEFC 0%, #FAF7FF 100%);
}

/* Podium style for rankings */
.ph-podium {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: flex-end;
  padding: 20px;
}
.ph-podium-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.ph-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, #E8D8F5, #CD50F1);
  opacity: 0.3;
}
.ph-avatar.main {
  width: 52px;
  height: 52px;
  opacity: 0.5;
  border: 2px solid #CD50F1;
}
.ph-bar {
  height: 6px;
  width: 50px;
  border-radius: 3px;
  background: #E8D8F5;
}

/* Calendar grid placeholder */
.ph-cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  padding: 8px;
}
.ph-cal-cell {
  aspect-ratio: 1;
  border-radius: 4px;
  background: #FAF7FF;
  border: 1px solid #E8D8F5;
}
.ph-cal-cell.has-event {
  background: #F3E8FC;
  border-color: #CD50F1;
}
</style>
</head>
<body>

<div class="section">
  <div class="sec-header">
    <div class="pill">a plataforma</div>
    <h3>Tudo isso dentro de um só lugar.</h3>
    <p>IA, trilhas, missões, gamificação, calendário e analytics — tudo integrado.</p>
  </div>

  <div class="showcase">

    <!-- Screen 1: Dashboard (back left) -->
    <div class="screen screen-1">
      <div class="screen-label"><span class="dot"></span> Dashboard</div>
      <div class="placeholder">
        <div class="ph-sidebar">
          <div class="ph-sidebar-logo"></div>
          <div class="ph-sidebar-item active"></div>
          <div class="ph-sidebar-item" style="width:70%;background:#9840AD"></div>
          <div class="ph-sidebar-item" style="width:60%;background:#9840AD"></div>
          <div class="ph-sidebar-item" style="width:80%;background:#9840AD"></div>
          <div class="ph-sidebar-item" style="width:55%;background:#9840AD"></div>
          <div class="ph-sidebar-item" style="width:65%;background:#9840AD"></div>
        </div>
        <div class="ph-content">
          <div class="ph-title"></div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
            <div class="ph-card purple" style="height:50px"></div>
            <div class="ph-card" style="height:50px"></div>
            <div class="ph-card" style="height:50px"></div>
          </div>
          <div class="ph-card" style="height:90px"></div>
        </div>
      </div>
    </div>

    <!-- Screen 2: Assistente IA (center, top) -->
    <div class="screen screen-2">
      <div class="screen-label"><span class="dot"></span> Assistente IA</div>
      <div class="placeholder">
        <div class="ph-sidebar">
          <div class="ph-sidebar-logo"></div>
          <div class="ph-sidebar-item" style="width:70%;background:#9840AD"></div>
          <div class="ph-sidebar-item" style="width:60%;background:#9840AD"></div>
          <div class="ph-sidebar-item" style="width:80%;background:#9840AD"></div>
          <div class="ph-sidebar-item" style="width:55%;background:#9840AD"></div>
          <div class="ph-sidebar-item active"></div>
          <div class="ph-sidebar-item" style="width:65%;background:#9840AD"></div>
        </div>
        <div class="ph-content">
          <div class="ph-title" style="width:180px"></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div>
              <div class="ph-card" style="height:120px;border-color:#CD50F1"></div>
              <div style="display:flex;gap:6px;margin-top:8px">
                <div style="height:24px;flex:1;background:#F3E8FC;border-radius:6px;border:1px solid #E8D8F5"></div>
                <div style="height:24px;width:80px;background:#CD50F1;border-radius:6px;opacity:0.6"></div>
              </div>
            </div>
            <div class="ph-card purple" style="height:160px"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Screen 3: Rankings (right) -->
    <div class="screen screen-3">
      <div class="screen-label"><span class="dot"></span> Rankings</div>
      <div class="placeholder">
        <div class="ph-sidebar" style="width:140px">
          <div class="ph-sidebar-logo"></div>
          <div class="ph-sidebar-item" style="width:70%;background:#9840AD"></div>
          <div class="ph-sidebar-item" style="width:60%;background:#9840AD"></div>
          <div class="ph-sidebar-item active"></div>
          <div class="ph-sidebar-item" style="width:55%;background:#9840AD"></div>
        </div>
        <div class="ph-content" style="left:140px">
          <div class="ph-title" style="width:80px"></div>
          <div class="ph-podium">
            <div class="ph-podium-item"><div class="ph-avatar"></div><div class="ph-bar"></div></div>
            <div class="ph-podium-item"><div class="ph-avatar main"></div><div class="ph-bar" style="background:#CD50F1;opacity:0.4"></div></div>
            <div class="ph-podium-item"><div class="ph-avatar"></div><div class="ph-bar"></div></div>
          </div>
          <div class="ph-card" style="height:30px;margin-top:8px"></div>
          <div class="ph-card" style="height:30px"></div>
        </div>
      </div>
    </div>

    <!-- Screen 4: Calendario (bottom left) -->
    <div class="screen screen-4">
      <div class="screen-label"><span class="dot"></span> Calendário</div>
      <div class="placeholder">
        <div class="ph-sidebar" style="width:130px">
          <div class="ph-sidebar-logo"></div>
          <div class="ph-sidebar-item" style="width:70%;background:#9840AD"></div>
          <div class="ph-sidebar-item" style="width:60%;background:#9840AD"></div>
          <div class="ph-sidebar-item" style="width:80%;background:#9840AD"></div>
          <div class="ph-sidebar-item active"></div>
        </div>
        <div class="ph-content" style="left:130px">
          <div class="ph-title" style="width:90px"></div>
          <div class="ph-cal-grid">
            <div class="ph-cal-cell"></div><div class="ph-cal-cell"></div><div class="ph-cal-cell"></div><div class="ph-cal-cell"></div><div class="ph-cal-cell has-event"></div><div class="ph-cal-cell"></div><div class="ph-cal-cell"></div>
            <div class="ph-cal-cell"></div><div class="ph-cal-cell has-event"></div><div class="ph-cal-cell"></div><div class="ph-cal-cell"></div><div class="ph-cal-cell"></div><div class="ph-cal-cell"></div><div class="ph-cal-cell has-event"></div>
            <div class="ph-cal-cell"></div><div class="ph-cal-cell"></div><div class="ph-cal-cell has-event"></div><div class="ph-cal-cell"></div><div class="ph-cal-cell"></div><div class="ph-cal-cell has-event"></div><div class="ph-cal-cell"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Screen 5: Missoes (bottom right) -->
    <div class="screen screen-5">
      <div class="screen-label"><span class="dot"></span> Missões</div>
      <div class="placeholder">
        <div class="ph-sidebar" style="width:130px">
          <div class="ph-sidebar-logo"></div>
          <div class="ph-sidebar-item" style="width:70%;background:#9840AD"></div>
          <div class="ph-sidebar-item active"></div>
          <div class="ph-sidebar-item" style="width:60%;background:#9840AD"></div>
          <div class="ph-sidebar-item" style="width:55%;background:#9840AD"></div>
        </div>
        <div class="ph-content" style="left:130px">
          <div class="ph-title" style="width:70px"></div>
          <div class="ph-card purple" style="height:45px"></div>
          <div class="ph-card" style="height:45px"></div>
          <div class="ph-card" style="height:45px"></div>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
